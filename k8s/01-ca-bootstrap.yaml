apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: "internal-mTLS-ca"
  secretName: root-ca-secret
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca-issuer
spec:
  ca:
    secretName: root-ca-secret

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sidecar-trust-bundle
  namespace: sidecar # We target the namespace where Traefik lives
spec:
  isCA: true
  commonName: "internal-mTLS-ca"
  secretName: root-ca-secret # Cert-manager creates this secret safely for us here
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer