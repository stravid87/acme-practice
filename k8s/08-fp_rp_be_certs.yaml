# kubectl apply -f -
# 1. Identity for the Forward Proxy
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forward-proxy-mtls-cert
  namespace: k8s-tutorial
spec:
  secretName: forward-proxy-mtls-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  subject:
    organizations:
      - tutorial-auth
  commonName: forward-proxy
  dnsNames:
    - forward-proxy
    - forward-proxy.k8s-tutorial.svc.cluster.local
  issuerRef:
    name: internal-ca-issuer
    kind: Issuer

---

# 2. Identity for the Reverse Proxy
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: reverse-proxy-mtls-cert
  namespace: k8s-tutorial
spec:
  secretName: reverse-proxy-mtls-tls
  duration: 2160h
  renewBefore: 360h
  commonName: reverse-proxy
  dnsNames:
    - reverse-proxy
    - reverse-proxy.k8s-tutorial.svc.cluster.local
  issuerRef:
    name: internal-ca-issuer
    kind: Issuer

---

# 3. Identity for the Backend
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backend-mtls-cert
  namespace: k8s-tutorial
spec:
  secretName: backend-mtls-tls
  duration: 2160h
  renewBefore: 360h
  commonName: backend
  dnsNames:
    - backend
    - backend.k8s-tutorial.svc.cluster.local
  issuerRef:
    name: internal-ca-issuer
    kind: Issuer