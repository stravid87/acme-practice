#kubectl patch deployment backend -n k8s-tutorial --patch-file k8s/11-be_patch.yaml
spec:
  template:
    spec:
      containers:
      - name: backend
        volumeMounts:
        - name: certs-volume
          mountPath: "/etc/certs"
          readOnly: true
      volumes:
      - name: certs-volume
        projected:
          sources:
          - secret:
              name: backend-mtls-tls
          - configMap:
              name: internal-trust-bundle