apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-sidecar-full-access
rules:
  - apiGroups:
      - "" 
    resources:
      - secrets    # To read the certs generated by cert-manager
      - services   # To find the backend pods
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - traefik.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-sidecar-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: sidecar #
roleRef:
  kind: ClusterRole
  name: traefik-sidecar-full-access
  apiGroup: rbac.authorization.k8s.io